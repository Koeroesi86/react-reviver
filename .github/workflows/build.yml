name: Branch build

on: 
  pull_request:
    branches:    
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - name: Persist cache
        uses: actions/cache@v3
        id: local-dot-cache
        with:
          path: .cache
          key: ${{ runner.os }}-local-dot-cache-${{ hashFiles('**/package-lock.json') }}
      - name: Setup
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Package version
        run: npm run generate-version
      - name: Package bundle
        run: npm run build
      - name: Package information
        run: npm publish --dry-run
